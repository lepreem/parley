# Runs the whole backend locally, and is the production topology too:
# compose.prod.yaml layers the server's differences on top (see deploy/). A
# RabbitMQ broker, one migrate one-shot that must finish first, then the API,
# which also runs transcription, and the YouTube fetcher.
#
#   npm run stack   (from the repo root: doppler run -- docker compose up)
#
# Secrets are passed through from the environment rather than read from a file:
# servers/cloud/.env only carries DOPPLER_TOKEN, and this keeps plaintext
# secrets off disk. Each service lists exactly what it needs, which is also the list to
# paste into whichever host you deploy to.
#
# Postgres and object storage are managed services (Supabase) and are not
# started here. RabbitMQ is: the services reach it over the compose
# network, so Doppler's MQ_URL, which points outside, is replaced below.

name: parley

# The broker's URL inside the compose network. RABBITMQ_PASSWORD falls back to
# a fixed one for the local stack; production requires it (deploy/deploy.sh).
# Keep it to letters and digits, since it sits in a URL unescaped.
x-mq-url: &mq-url MQ_URL=amqp://parley:${RABBITMQ_PASSWORD:-parley}@rabbitmq:5672

services:
  # Messages and queues survive restarts and redeploys on the named volume:
  # every publisher marks its messages persistent and waits for the confirm.
  # The app declares its own queues at startup, so a fresh volume needs no
  # setup. The user and password apply only when the volume is first created;
  # changing RABBITMQ_PASSWORD later needs `rabbitmqctl change_password`.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq # names the data directory, which must stay put
    environment:
      - RABBITMQ_DEFAULT_USER=parley
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-parley}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # The management UI, on loopback only. On the server, reach it through
      # an SSH tunnel: ssh -L 15672:127.0.0.1:15672 <server>.
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Must complete before anything that touches the database starts. Needs only
  # DATABASE_URL, not the application's other secrets.
  migrate:
    build:
      # The repo root: the image carries the built client the API serves.
      context: ../..
      dockerfile: servers/cloud/backend/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      - DATABASE_URL
    restart: "no"

  api:
    build:
      # The repo root: the image carries the built client the API serves.
      context: ../..
      dockerfile: servers/cloud/backend/Dockerfile
    command: ["node", "dist/api.js"]
    environment:
      - DATABASE_URL
      - *mq-url
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - OPENROUTER_API_KEY
      # Guest chat is on only with both of these (backend/src/env.ts).
      - GUEST_SESSION_SECRET
      - OPENROUTER_GUEST_API_KEY
      - DEEPGRAM_API_KEY
      - WORKOS_API_KEY
      - WORKOS_CLIENT_ID
      - CLIENT_URL
      - API_BASE_URL
      - PORT
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # `node -e` rather than curl: the alpine image has no curl, and fetch is
      # global on Node 22.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Reads queue and bucket names from the API's /contract at boot, so it waits
  # for the API to be healthy rather than merely started.
  youtube-fetcher:
    build:
      context: ./youtube-fetcher
    environment:
      - *mq-url
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      # Deliberately not the API_BASE_URL the API itself uses: that one is the
      # public URL WorkOS redirects back to, while this is one container
      # calling another over the compose network.
      - API_BASE_URL=http://api:${PORT:-3001}
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq-data:
