name: Deploy

# Builds the cloud images on every push to main and deploys them to the VPS.
#
# Off until the server exists: set the repository variable DEPLOY_ENABLED to
# "true". servers/cloud/deploy/README.md lists the secrets and variables this
# reads and where each comes from.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order. A running deploy is never cancelled
# halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/lepreem

# Actions are pinned to a commit, not a tag like v5: whoever controls an
# action's repo can move a tag to other code, and these steps hold the deploy
# key and a token that pushes images. .github/dependabot.yml moves them on.

jobs:
  build:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # The repo root, because the image carries the built client and
          # reads packages/ (see the Dockerfile).
          - image: parley-cloud
            context: .
            file: servers/cloud/backend/Dockerfile
          - image: parley-youtube-fetcher
            context: servers/cloud/youtube-fetcher
            file: servers/cloud/youtube-fetcher/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SERVER: deploy@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned, so the workflow refuses a server it hasn't seen before.
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the deploy files
        run: >
          scp servers/cloud/compose.yaml servers/cloud/compose.prod.yaml
          servers/cloud/deploy/deploy.sh servers/cloud/deploy/parley.caddy
          "$SERVER:/opt/parley/"

      # The token only lasts as long as this job, and goes in on stdin so it
      # never shows in the server's process list.
      - name: Log the server in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          printf '%s' "$GITHUB_TOKEN" |
          ssh "$SERVER" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Through sh, since scp doesn't carry over an executable bit.
      - name: Deploy
        run: >
          ssh "$SERVER"
          IMAGE_TAG=${{ github.sha }}
          PARLEY_DOMAIN=${{ vars.PARLEY_DOMAIN }}
          sh /opt/parley/deploy.sh

      - name: Log the server out of GHCR
        if: always()
        run: ssh "$SERVER" docker logout ghcr.io || true
