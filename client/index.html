<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parley</title>
    <script>
      // Before the first paint, so the page never flashes the wrong colours.
      // Same keys as hooks/theme/themes.ts; React takes over once it loads.
      (function () {
        var root = document.documentElement;
        var theme = null;
        var mode = null;
        try {
          theme = localStorage.getItem("parley-palette");
          mode = localStorage.getItem("parley-mode");
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = theme || "studio";
        if (dark) root.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
